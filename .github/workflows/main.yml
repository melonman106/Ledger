# Pings melonman106.dpdns.org every 10 minutes to prevent free-tier spin-down.
# Place this file at: .github/workflows/ping-render.yml

name: Ping Render

on:
  schedule:
    # Every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render website
        run: |
          echo "Pinging https://melonman106.dpdns.org ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://melonman106.dpdns.org" || true)
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Ping successful"
          else
            echo "⚠️ Non-2xx/3xx response (status $HTTP_STATUS) — the site may still be waking up"
          fi
